[package]
name = "acre"
version = "0.1.0"
edition = "2024"
authors = ["Jack Roddy <jack.w.roddy@gmail.com>"]
repository = "https://github.com/jackroddy/acre"
license = "MIT OR Apache-2.0"
description = "animation creation and rendering engine: renders animations written in its own small language"
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tiny-skia = "0.12"
ttf-parser = "0.25"
