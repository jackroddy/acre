[package]
name = "acre"
version = "0.1.0"
description = "animation creation and rendering engine: renders drawings written in its own small language"
readme = "../../README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
krilla = { version = "0.8.2", default-features = false }
rustybuzz = "0.20.1"
self_cell = "1.3"
tiny-skia = "0.12"
ttf-parser = "0.25"

[dev-dependencies]
lopdf = { version = "0.47", default-features = false }
roxmltree = "0.21"
