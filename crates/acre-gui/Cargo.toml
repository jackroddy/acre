[package]
name = "acre-gui"
version = "0.3.0"
description = "a viewer for acre drawings: the render of a file, or of what an editor sends, updated as it changes"
readme = "../../README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
acre = { path = "../acre", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = "0.12"
una = "0.2.0"
